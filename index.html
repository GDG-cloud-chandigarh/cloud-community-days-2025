<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Defaults for the home page and for crawlers that do not run JavaScript.
      Each page's Seo component replaces the tags marked data-rh="true".
    -->
    <title>Cloud Community Days 2026 Chandigarh | 23 October</title>
    <meta data-rh="true" name="description" content="Cloud Community Days 2026 by GDG Cloud Chandigarh on 23 October at Chandigarh University: talks on Google Cloud, AI/ML and DevOps, hands-on labs and networking." />
    <link data-rh="true" rel="canonical" href="https://ccd.gdgcloudchandigarh.com/" />
    <meta name="author" content="GDG Cloud Chandigarh" />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" type="image/png" href="/images/gdg-logo.png" />
    <link rel="apple-touch-icon" href="/images/gdg-logo.png" />

    <!-- The hero logo is the largest thing on first paint; fetch it before the app runs. -->
    <link rel="preload" as="image" href="/images/ccd-2026-logo.png" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack) -->

    <meta property="og:site_name" content="Cloud Community Days 2026 Chandigarh" />
    <meta property="og:locale" content="en_IN" />
    <meta data-rh="true" property="og:title" content="Cloud Community Days 2026 Chandigarh | 23 October" />
    <meta data-rh="true" property="og:description" content="Cloud Community Days 2026 by GDG Cloud Chandigarh on 23 October at Chandigarh University: talks on Google Cloud, AI/ML and DevOps, hands-on labs and networking." />
    <meta data-rh="true" property="og:url" content="https://ccd.gdgcloudchandigarh.com/" />
    <meta property="og:image" content="https://ccd.gdgcloudchandigarh.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cloud Community Days 2026, 23 October 2026 in Chandigarh, by GDG Cloud Chandigarh" />

    <meta name="twitter:image" content="https://ccd.gdgcloudchandigarh.com/og-image.jpg" />
